# Projects are always deployed together.
PROJECTS=(
    "apiserver"
    "adminpanel"
    "userpanel"
)

# Relative to INSTALL_ROOT_DIR. Do not start with "/".
INSTALL_DIR_apiserver="api.mydomain.com/public_html"
INSTALL_DIR_adminpanel="admin.mydomain.com/public_html"
INSTALL_DIR_userpanel="user.mydomain.com/public_html"

INCLUDE_PATTERNS=(
    "*.php"
    "*.css"
    "*.js"
    "*.html"
    "*.json"
    "*.png"
    "*.jpg"
    "*.jpeg"
    "*.svg"
)

EXCLUDE_PATTERNS=(
    ".git/**"
    "node_modules/**"
    "runtime/**"
    "cache/**"
    "logs/**"
    ".env"
    "*.log"
    "*.tmp"
    "*-local.*"
    "composer-dev.json"
)
