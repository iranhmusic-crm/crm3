# Projects are always deployed together.
PROJECTS=(
    "apiserver"
    "adminpanel"
    "userpanel"
)

# Relative to INSTALL_ROOT_DIR. Do not start with "/".
INSTALL_DIR_apiserver="api.iranhmusic.ir/public_html"
INSTALL_DIR_adminpanel="admin.iranhmusic.ir/public_html"
INSTALL_DIR_userpanel="my.iranhmusic.ir/public_html"

# Include all files by default, except excluded patterns.
INCLUDE_PATTERNS=(
    "*"
)

EXCLUDE_PATTERNS=(
    # Runtime and test directories at the project root
    "runtime/**"
    "tests/**"
    "web/assets/**"

    # Temporary files and logs
    "tmp"
    "*.tmp"
    "*.log"

    # Development and test files
    "*-dev.*"
    "*-local.*"
    "*-test.*"
    "*DevTest*"
    "DevTestPaymentGateway.php"

    # Git metadata directories at any depth
    "**/.git/**"

    # Nested vendor directories; preserve the main vendor directory
    "vendor/**/vendor/**"
)
